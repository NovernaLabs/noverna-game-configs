; UEnum layout for Palworld (since game version 0.4.1.5). Without it, UE4SS crashes whenever it reads enums
; (dumping types or mappings, mods that touch enum properties). Source: https://github.com/UE4SS-RE/RE-UE4SS/issues/802
[UEnum]
CppForm = 0x58
CppType = 0x30
EnumDisplayNameFn = 0x60
EnumFlags_Internal = 0x5C
EnumPackage = 0x68
Names = 0x48
